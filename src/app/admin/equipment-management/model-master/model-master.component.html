<div class="container mb-4">
  <div class="d-flex justify-content-between align-items-center flex-wrap mb-4">
    <h1 class="text-primary table-heading-detail">
      Model Master
    </h1>
    <div class="d-flex align-items-center gap-3">
      <div class="d-flex align-items-center gap-2">
        <span class="text-muted small fw-bold">Show</span>
        <ng-select [items]="tableSizes" [(ngModel)]="tableSize" (change)="onTableSizeChange($event)" [clearable]="false"
          [searchable]="false" class="custom-ng-select min-w-[80px]">
        </ng-select>
        <span class="text-muted small fw-bold">entries</span>
      </div>
      <button class="btn btn-custom-primary px-4 py-2" (click)="openAddModal()">
        <i class="fas fa-plus me-1"></i> Add Model
      </button>
    </div>
  </div>

  <div class="bg-white rounded border border-gray-200 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="bg-light">
          <tr>
            <th class="px-4 py-3 text-secondary" style="font-size: 12px; font-weight: 600">
              MODEL NAME
            </th>
            <th class="px-4 py-3 text-secondary" style="font-size: 12px; font-weight: 600">
              STATUS
            </th>
            <th class="px-4 py-3 text-secondary text-end" style="font-size: 12px; font-weight: 600">
              ACTIONS
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let model of paginatedModels" class="align-middle">
            <td class="px-4 py-3 text-dark">{{ model.name }}</td>
            <td class="px-4 py-3">
              <span class="badge" [ngClass]="
                  model.isActive
                    ? 'bg-success text-white'
                    : 'bg-danger text-white'
                ">
                {{ model.isActive ? "Active" : "Inactive" }}
              </span>
            </td>
            <td class="px-4 py-3 text-end">
              <button *ngIf="model.isActive" class="btn btn-sm btn-outline-primary me-2" (click)="openEditModal(model)"
                title="Edit">
                <i class="fa-solid fa-edit"></i>
              </button>
              <button class="btn btn-sm" [ngClass]="
                  model.isActive
                    ? 'btn-outline-danger'
                    : 'btn-outline-success'
                " (click)="toggleActiveStatus(model)" [title]="model.isActive ? 'Deactivate' : 'Activate'">
                <i class="fa-solid" [ngClass]="model.isActive ? 'fa-ban' : 'fa-check-circle'"></i>
              </button>
            </td>
          </tr>
          <tr *ngIf="paginatedModels.length === 0">
            <td colspan="3" class="text-center py-4 text-muted">
              No models found.
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Footer / Pagination -->
    <div class="d-flex justify-content-between align-items-center px-4 py-3 border-top bg-light">
      <div class="text-muted small">
        Showing {{ paginatedModels.length }} of {{ totalRecords }} Models
      </div>
      <div class="d-flex gap-1">
        <button (click)="goToPage(page - 1)" [disabled]="page === 1"
          class="btn btn-sm btn-outline-secondary d-flex align-items-center justify-content-center"
          style="width: 32px; height: 32px">
          <i class="fas fa-chevron-left" style="font-size: 10px"></i>
        </button>
        <button *ngFor="let p of paginationNumbers" (click)="goToPage(p)" [ngClass]="{
            'btn-custom-primary text-white': p === page,
            'btn-outline-secondary bg-white': p !== page,
          }" class="btn btn-sm fw-bold d-flex align-items-center justify-content-center"
          style="width: 32px; height: 32px">
          {{ p }}
        </button>
        <button (click)="goToPage(page + 1)" [disabled]="page === totalPages || totalPages === 0"
          class="btn btn-sm btn-outline-secondary d-flex align-items-center justify-content-center"
          style="width: 32px; height: 32px">
          <i class="fas fa-chevron-right" style="font-size: 10px"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal for Add/Edit -->
<div *ngIf="isModalOpen" class="modal-container">
  <div class="bg-white rounded-3 shadow-lg d-flex flex-column" style="width: 500px; max-width: 90%">
    <div class="modal-header-custom px-4 py-3 d-flex justify-content-between align-items-center border-bottom">
      <h4 class="mb-0 text-primary fw-bold">
        {{ isEditMode ? "Edit Model" : "Add New Model" }}
      </h4>
      <button class="btn bg-transparent border-0 p-0" (click)="closeModal()">
        <i class="fa-solid fa-xmark fs-4 text-muted"></i>
      </button>
    </div>

    <form [formGroup]="modelForm" (ngSubmit)="saveModel()">
      <div class="modal-body-custom px-4 py-4">
        <div class="mb-3">
          <label class="form-label form-lable-custom">Model Name *</label>
          <input type="text" class="form-control form-input-custom" placeholder="e.g. CAT 320D, Komatsu PC210"
            formControlName="name" [ngClass]="{
              'is-invalid':
                modelForm.get('name')?.invalid &&
                modelForm.get('name')?.touched,
            }" />
          <div class="invalid-feedback">Model Name is required.</div>
        </div>
      </div>
      <div class="px-4 py-3 border-top bg-light text-end">
        <button class="btn btn-secondary px-4 py-2 me-3" type="button" (click)="closeModal()">
          Cancel
        </button>
        <button class="btn btn-custom-primary px-4 py-2" type="submit">
          {{ isEditMode ? "Update" : "Save" }}
        </button>
      </div>
    </form>
  </div>
</div>
